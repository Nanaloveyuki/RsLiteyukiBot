[package]
name = "liteyukibot-tauri"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
liteyukibot-core = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.10.2", features = ["image-ico", "tray-icon"] }
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread"] }
