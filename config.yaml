rust:
  runtime:
    worker_count: 4
    ingress_queue: 512
    worker_queue: 256
  log:
    mode: color
    level: debug
    timezone: local
    timestamp_format: custom
    timestamp_pattern: "%Y-%m-%d %H:%M:%S"
  adapters: []
  tui:
    resume:
      store_path: ./.liteyuki-tui-resumes.json
      max_sessions: 64
      max_size_mib: 16

connect:
  websocket:
    enabled: true
    # mode: forward | reverse | both
    mode: reverse
    host: 0.0.0.0
    port: 8080
    path: /ws
    max_payload_size: 1048576
    max_connections: 100
    # url: ws://127.0.0.1:3000/ws
    timeout_seconds: 30
    # optional split config; when set, forward/reverse can be enabled together
    # forward:
    #   enabled: true
    #   url: ws://127.0.0.1:3000/ws
    # reverse:
    #   enabled: true
    #   host: 0.0.0.0
    #   port: 8080
    #   path: /ws
  tcp-http:
    enabled: false
    host: 127.0.0.1
    port: 8081
    path: /
    max_payload_size: 1048576
    max_connections: 100
    timeout_seconds: 30
  sse:
    enabled: false
    host: 127.0.0.1
    port: 8082
    path: /sse
    max_payload_size: 1048576
    max_connections: 100
    timeout_seconds: 30

llm:
  # 建议把密钥放到独立 llm-config.yaml（或设置 LY_LLM_CONFIG_PATH）并加入 .gitignore。
  enabled: true
  provider: openai
  base_url: https://api.openai.com/v1
  model: gpt-5.2
  timeout_seconds: 20
  command_prefix: /ask
  # api_keys:
  #   - sk-xxx
  # api_key moved to llm-config.yaml
  system_prompt: "You are a helpful assistant."

onebot-v11:
  # 仅白名单会话可触发外部 /help。
  # 可写纯ID（private常用 user_id；group常用 group_id）或带前缀:
  # - "3541766758"
  # - "private:3541766758"
  # - "group:699493240"
  whitelist:
    - 'private:3541766758'
