<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RsLiteyukiBot</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #e2e8f0;
        font-family: "Segoe UI", sans-serif;
      }

      main {
        max-width: 32rem;
        padding: 2rem;
        border-radius: 1rem;
        background: rgba(15, 23, 42, 0.82);
        box-shadow: 0 18px 60px rgba(15, 23, 42, 0.45);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
      }

      p {
        margin: 0;
        line-height: 1.6;
      }

      code {
        color: #f8fafc;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>RsLiteyukiBot</h1>
      <p>Frontend assets are unavailable. Run <code>pnpm build</code> or <code>pnpm dev</code> first.</p>
    </main>
  </body>
</html>
